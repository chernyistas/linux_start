# ============================================================
# ServiceMonitor — это Kubernetes-объект, который говорит
# Prometheus'у: "Опрашивай этот Service, собирай метрики".
# Оператор Prometheus автоматически подхватывает ServiceMonitor
# и добавляет его цель в конфиг Prometheus.
# ============================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-app-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: flask-app
  namespaceSelector:
    any: true
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
