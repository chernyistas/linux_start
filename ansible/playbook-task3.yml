# ============================================================
# playbook-task3.yml — развёртывание мониторинга через роль
# ============================================================
# Playbook короткий: вся логика в роли.
# ============================================================

---
- name: Развертывание мониторинга на свежем сервере
  hosts: fresh_servers
  become: true

  vars:
    prometheus_port: 9090
    node_exporter_port: 9100

  roles:
    - monitoring
