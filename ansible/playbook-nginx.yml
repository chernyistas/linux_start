# ============================================================
# playbook-nginx.yml — использование роли nginx
# ============================================================
# Playbook стал коротким: он просто вызывает роль.
# Вся логика — в роли.
# ============================================================

---
- name: Настройка веб-сервера
  hosts: local
  become: true

  vars:
    nginx_port: 8090
    nginx_site_title: "DevOps Portfolio"
    nginx_greeting: "Hello from Ansible Role nginx!"

  roles:
    - nginx
