# ============================================================
# playbook-task1.yml — подготовка свежего сервера
# ============================================================
# Задачи:
#   1. Обновить apt cache
#   2. Установить базовые пакеты
#   3. Создать пользователя deploy с sudo
#   4. Настроить UFW (firewall)
#   5. Включить UFW
# ============================================================

---
- name: Подготовка свежего сервера
  hosts: fresh_servers
  become: true

  vars:
    deploy_user: deploy
    base_packages:
      - sudo
      - curl
      - git
      - vim
      - htop
      - ufw

  tasks:
    # ----------------------------------------------------------
    # 1. Обновить apt cache
    # ----------------------------------------------------------
    - name: Обновить apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # ----------------------------------------------------------
    # 2. Установить базовые пакеты
    # ----------------------------------------------------------
    - name: Установить базовые пакеты
      apt:
        name: "{{ base_packages }}"
        state: present

    # ----------------------------------------------------------
    # 3.2 Создать пользователя deploy
    # ----------------------------------------------------------

    - name: Создать группу deploy
      group:
        name: "{{ deploy_user }}"
        state: present

    # ----------------------------------------------------------
    # 3.2 Создать пользователя deploy
    # ----------------------------------------------------------
    - name: Создать пользователя deploy
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: yes
        group: "{{ deploy_user }}"
        groups: sudo
        append: yes
        state: present

