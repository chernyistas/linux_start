---
# tasks file for roles/nginx
# ============================================================
# Что делает роль:
#   1. Устанавливает nginx
#   2. Создаёт директорию для статики
#   3. Генерирует index.html из Jinja2-шаблона
#   4. Копирует конфиг nginx из Jinja2-шаблона
#   5. Убеждается, что nginx запущен
# ============================================================

# ------------------------------------------------------------
# 1. Установить nginx
# ------------------------------------------------------------
- name: Установить nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
    cache_valid_time: 3600
  # name: nginx — пакет
  # state: present — установлен
  # update_cache: обновить apt
  # cache_valid_time: не обновлять, если < 1 часа

# ------------------------------------------------------------
# 2. Создать директорию для статики
# ------------------------------------------------------------
- name: Создать директорию для статики
  file:
    path: "{{ nginx_root_dir }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0755'
  # {{ nginx_root_dir }} — переменная из defaults
  # mode: '0755' — rwxr-xr-x

# ------------------------------------------------------------
# 3. Сгенерировать index.html из шаблона
# ------------------------------------------------------------
- name: Сгенерировать index.html из шаблона
  template:
    src: index.html.j2
    dest: "{{ nginx_root_dir }}/index.html"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0644'
  notify: Перезапустить nginx
  # template: обрабатывает Jinja2
  # src: файл в templates/
  # dest: куда положить
  # notify: если изменилось — вызвать handler

# ------------------------------------------------------------
# 4. Скопировать конфиг nginx из шаблона
# ------------------------------------------------------------
- name: Скопировать конфиг nginx
  template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Перезапустить nginx

# ------------------------------------------------------------
# 5. Убедиться, что nginx запущен
# ------------------------------------------------------------
- name: Убедиться, что nginx запущен
  service:
    name: nginx
    state: started
    enabled: yes
  # started: запущен сейчас
  # enabled: автозапуск при загрузке
