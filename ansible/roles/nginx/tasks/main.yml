---
# tasks file for roles/nginx

# ------------------------------------------------------------
# 1. Установить nginx
# ------------------------------------------------------------
- name: Установить nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

# ------------------------------------------------------------
# 2. Создать директорию для статики
# ------------------------------------------------------------
- name: Создать директорию для статики
  file:
    path: "{{ nginx_root_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

# ------------------------------------------------------------
# 3. Скопировать index.html из шаблона
# ------------------------------------------------------------
- name: Скопировать index.html из шаблона
  template:
    src: index.html.j2
    dest: "{{ nginx_root_dir }}/index.html"
    owner: www-data
    group: www-data
    mode: '0644'
  notify: Перезапустить nginx

# ------------------------------------------------------------
# 4. Скопировать конфиг nginx
# ------------------------------------------------------------
- name: Скопировать конфиг nginx
  template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Перезапустить nginx

# ------------------------------------------------------------
# 5. Убедиться, что nginx запущен
# ------------------------------------------------------------
- name: Убедиться, что nginx запущен
  service:
    name: nginx
    state: started
    enabled: yes

# ------------------------------------------------------------
# 6. Проверить доступность сайта
# ------------------------------------------------------------
- name: Проверить доступность сайта
  uri:
    url: "http://localhost:{{ nginx_port }}"
    return_content: yes
  register: nginx_response

- name: Показать статус
  debug:
    msg: "Nginx отвечает: {{ nginx_response.status }}"
