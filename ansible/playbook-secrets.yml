# ============================================================
# playbook-secrets.yml — демонстрация Ansible Vault
# ============================================================
---
- name: Демонстрация Ansible Vault
  hosts: local
  become: false

  vars_files:
    - secrets.yml

  tasks:
    # ----------------------------------------------------------
    # 1. Длина пароля (безопасно — не показываем сам пароль)
    # ----------------------------------------------------------
    - name: Показать длину пароля
      debug:
        msg: "Длина db_password: {{ db_password | length }} символов"

    # ----------------------------------------------------------
    # 2. Хеш пароля (безопасно — по хешу не восстановить пароль)
    # ----------------------------------------------------------
    - name: Показать SHA256-хеш пароля
      debug:
        msg: "SHA256: {{ db_password | hash('sha256') }}"

    # ----------------------------------------------------------
    # 3. Префикс токена (безопасно — только первые 5 символов)
    # ----------------------------------------------------------
    - name: Показать префикс токена
      debug:
        msg: "api_token начинается с: {{ api_token[:5] }}..."

    # ----------------------------------------------------------
    # 4. Использование секретов в задаче (создание файла)
    # ----------------------------------------------------------
    - name: Создать файл с использованием секретов
      copy:
        content: |
          db_password_length: {{ db_password | length }}
          db_password_hash: {{ db_password | hash('sha256') }}
          api_token_prefix: {{ api_token[:5] }}
        dest: /tmp/secrets-demo.txt
        mode: '0600'

    # ----------------------------------------------------------
    # 5. Показать, что файл создан
    # ----------------------------------------------------------
    - name: Показать содержимое созданного файла
      command: cat /tmp/secrets-demo.txt
      register: file_content
      changed_when: false

    - name: Вывести содержимое
      debug:
        msg: "{{ file_content.stdout_lines }}"
