# ============================================================
# setup-app.yml — настройка приложения через Ansible
# ============================================================
---
- name: Настройка приложения
  hosts: local
  become: true

  vars:
    app_name: my-app
    app_dir: /opt/my-app
    app_user: appuser
    app_port: 8080

  tasks:
    # --------------------------------------------------------
    # 1. Создать пользователя для приложения
    # --------------------------------------------------------
    - name: Создать пользователя приложения
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: yes
        state: present

    # --------------------------------------------------------
    # 2. Создать директорию приложения
    # --------------------------------------------------------
    - name: Создать директорию приложения
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    # --------------------------------------------------------
    # 3. Скопировать index.html из шаблона (template)
    # --------------------------------------------------------
    - name: Сгенерировать index.html из шаблона
      template:
        src: templates/index.html.j2
        dest: "{{ app_dir }}/index.html"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
      notify: Перезапустить nginx-container

    # --------------------------------------------------------
    # 4. Запустить nginx-контейнер
    # --------------------------------------------------------
    - name: Запустить nginx-контейнер
      docker_container:
        name: "{{ app_name }}-nginx"
        image: nginx:latest
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:80"
        volumes:
          - "{{ app_dir }}:/usr/share/nginx/html:ro"

    # --------------------------------------------------------
    # 5. Подождать 2 секунды, пока nginx стартует
    # --------------------------------------------------------
    - name: Подождать запуска nginx
      pause:
        seconds: 2

    # --------------------------------------------------------
    # 6. Проверить, что приложение отвечает (uri)
    # --------------------------------------------------------
    - name: Проверить приложение через HTTP
      uri:
        url: "http://localhost:{{ app_port }}"
        return_content: yes
      register: response

    # --------------------------------------------------------
    # 7. Показать ответ (debug)
    # --------------------------------------------------------
    - name: Показать первые 200 символов ответа
      debug:
        msg: "Ответ: {{ response.content[:200] }}"

    # --------------------------------------------------------
    # 8. Убедиться, что ответ содержит app_name
    # --------------------------------------------------------
    - name: Проверить содержимое ответа
      assert:
        that:
          - "app_name in response.content"
        success_msg: "Приложение отвечает корректно"
        fail_msg: "Приложение не содержит app_name"

    # ----------------------------------------------------------
    # handlers — запускаются при notify
    # ----------------------------------------------------------
  handlers:
    - name: Перезапустить nginx-container
      docker_container:
        name: "{{ app_name }}-nginx"
        state: started
        restart: yes

