# ============================================================
# install-docker.yml — установка Docker через Ansible
# ============================================================
# Playbook — это список "пьес" (plays).
# Каждая пьеса — набор задач для группы хостов.
# ============================================================

---
- name: Установка Docker на серверах
  hosts: local
  become: true

  tasks:
    # --------------------------------------------------------
    # Задача 1: обновить список пакетов
    # --------------------------------------------------------
    - name: Обновить apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # --------------------------------------------------------
    # Задача 2: установить необходимые пакеты
    # --------------------------------------------------------
    - name: Установить зависимости
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    # --------------------------------------------------------
    # Задача 3: создать директорию для ключей
    # --------------------------------------------------------
    - name: Создать директорию /etc/apt/keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # --------------------------------------------------------
    # Задача 4: скачать GPG-ключ Docker (современный способ)
    # --------------------------------------------------------
    - name: Скачать GPG-ключ Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    # --------------------------------------------------------
    # Задача 5: добавить репозиторий с Signed-By
    # --------------------------------------------------------
    - name: Добавить репозиторий Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: yes

    # --------------------------------------------------------
    # Задача 6: запустить Docker и включить автозапуск
    # --------------------------------------------------------
    - name: Запустить Docker
      service:
        name: docker
        state: started
        enabled: yes

    # --------------------------------------------------------
    # Задача 7: добавить пользователя в группу docker
    # --------------------------------------------------------
    - name: Добавить пользователя в группу docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
