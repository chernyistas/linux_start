name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-flask-app:latest
            ${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ github.sha }}

  deploy:
    needs: build-and-push

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update deployment image
        run: |
          kubectl set image deployment/flask-app \
            flask-app=${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ github.sha }}

          kubectl rollout status deployment/flask-app --timeout=300s

      - name: Apply Kubernetes manifests
        run: |
          cd k8s
          kubectl apply -f postgres.yaml
          kubectl apply -f flask-app.yaml
          kubectl apply -f adminer.yaml
          kubectl apply -f ingress-flask.yaml
          kubectl apply -f ingress-adminer.yaml

      - name: Check pods
        run: kubectl get pods

